plugins {
    id 'com.android.application' version '8.13.0' apply false
}
tasks.register('assembleFlip', Exec) {
    dependsOn ':flip:assembleDebug'
    commandLine 'python3', 'tools/rebuild.py'
}
tasks.register('validationClasspath') {
    dependsOn ':flip:compileDebugJavaWithJavac'
    doLast {
        file('build/validation-classpath.txt').text = project(':flip').tasks.named('compileDebugJavaWithJavac').get().classpath.asPath
    }
}
