name: Pro 1.0.4 Seamless Flip APK
on:
  push:
  pull_request:
  workflow_dispatch:
defaults:
  run:
    working-directory: pro
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK prerequisites
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Compile, Android lint, unit tests and reconstruct original APK
        run: |
          python3 - <<'PY'
          import subprocess
          result = subprocess.run(['./gradlew', '--no-daemon', ':flip:lintDebug', ':flip:testDebugUnitTest', 'assembleFlip', 'validationClasspath'], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          print(result.stdout)
          if result.returncode:
              tail = '\n'.join(result.stdout.splitlines()[-55:]).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Android build diagnostics::' + tail)
          raise SystemExit(result.returncode)
          PY
      - name: Validate identity, structure and preserved resources
        run: python3 tools/verify_apk.py
      - name: Build signed validation harness for the final APK
        run: python3 tools/logo_device_test.py --build-only
      - name: Upload installable test APK and provenance
        uses: actions/upload-artifact@v4
        with:
          name: Media-Wahid-TV-Camera-Pro-1.0.4-SEAMLESS
          path: pro/artifacts/*
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-checks
          path: |
            pro/flip/build/reports/
            pro/flip/build/test-results/
  install-launch:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Media-Wahid-TV-Camera-Pro-1.0.4-SEAMLESS
          path: pro/artifacts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Photo pixel inspection dependency
        run: python3 -m pip install Pillow==11.3.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch, photos and native camera regression on Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -no-snapshot -camera-back emulated -camera-front emulated
          script: cd pro && python3 tools/runtime_suite.py
      - name: Publish validation results
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              for name in ['device-smoke', 'device-state', 'logo-device', 'photo-device', 'video-device']:
                  path = Path('artifacts') / (name + '.json')
                  summary.write('### ' + name + '\n\n')
                  if path.is_file():
                      result = json.loads(path.read_text())
                      summary.write('```json\n' + json.dumps(result, indent=2) + '\n```\n\n')
                      if name == 'video-device':
                          compact = {'result': result['result'], 'assertions': result['assertions'], 'quick': result['quick'], 'timing_failures': result.get('timing_failures', []),
                                     'sessions': [{key: session.get(key) for key in ['name', 'orientation', 'video', 'audio', 'flips', 'manual_pause', 'watermark_pixels', 'animated_emulator_playback_difference']} for session in result['sessions']],
                                     'frame_bridge_log': result.get('frame_bridge_log', []), 'scope': result['scope']}
                          notice = json.dumps(compact).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                          print('::notice title=Encoded video evidence::' + notice)
                          for session in result['sessions']:
                              timings = session.get('flips', [])
                              details = {key: session.get(key) for key in ['name', 'orientation', 'video', 'audio', 'manual_pause', 'watermark_pixels', 'animated_emulator_playback_difference']}
                              details.update(result=result['result'], flips=len(timings), max_flip_ready_ms=max((x['ready_ms'] for x in timings), default=0))
                              print('::notice title=Playback ' + session['name'] + '::' + json.dumps(details).replace('%', '%25'))
                  else:
                      summary.write('No result file; inspect failed step.\n\n')
          PY
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-launch-evidence
          path: |
            pro/artifacts/device-smoke.json
            pro/artifacts/device-state.json
            pro/artifacts/logo-device.json
            pro/artifacts/logo-evidence/
            pro/artifacts/photo-device.json
            pro/artifacts/photo-evidence/
            pro/artifacts/video-device.json
            pro/artifacts/video-instrumentation.log
            pro/artifacts/video-logcat.txt
            pro/artifacts/video-evidence/
            pro/artifacts/runtime-stage-*.log
