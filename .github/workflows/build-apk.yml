name: Build MEDIA WAHID TV Camera FINAL

on:
  push:
    branches: [ main, final-v5-live-watermark ]
  workflow_dispatch:

jobs:
  final-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct final Masjid logo
        run: |
          cat app/src/main/logo-source/masjid_final.part*.b64 | tr -d '\n\r ' | base64 -d > app/src/main/res/drawable-nodpi/masjid_raya_logo.jpg
          test "$(stat -c%s app/src/main/res/drawable-nodpi/masjid_raya_logo.jpg)" = "8690"
          echo "667ad7deacf950ac42f3cb8bb3b3b80228399b70f15ae7b9f7f5177bfc3adbb5  app/src/main/res/drawable-nodpi/masjid_raya_logo.jpg" | sha256sum -c -

      - name: Verify watermark assets
        run: |
          test -s app/src/main/res/drawable-nodpi/media_wahid_logo_original.jpg
          test -s app/src/main/res/drawable-nodpi/masjid_raya_logo.jpg

      - name: Static final-architecture gate
        run: |
          set -eux
          grep -R 'versionName = "5.0.0"' app/build.gradle.kts
          grep -R 'val cameraX = "1.6.2"' app/build.gradle.kts
          grep -R 'CameraEffect.PREVIEW or' app/src/main/java/tv/mediawahid/camera/MainActivity.kt
          grep -R 'CameraEffect.VIDEO_CAPTURE or' app/src/main/java/tv/mediawahid/camera/MainActivity.kt
          grep -R 'CameraEffect.IMAGE_CAPTURE' app/src/main/java/tv/mediawahid/camera/MainActivity.kt
          grep -R 'asPersistentRecording()' app/src/main/java/tv/mediawahid/camera/MainActivity.kt
          grep -R 'Quality.FHD' app/src/main/java/tv/mediawahid/camera/MainActivity.kt
          grep -R 'MediaStoreOutputOptions' app/src/main/java/tv/mediawahid/camera/MainActivity.kt
          grep -R 'setOnDrawListener' app/src/main/java/tv/mediawahid/camera/MainActivity.kt
          grep -R 'liveWatermarkRenderer.draw(frame)' app/src/main/java/tv/mediawahid/camera/MainActivity.kt

          ! grep -R 'EXTRA_DURATION_LIMIT' app/src/main/java || exit 1
          ! grep -R 'setFileSizeLimit' app/src/main/java || exit 1
          ! grep -R 'ACTION_VIDEO_CAPTURE' app/src/main/java || exit 1
          ! grep -R 'INTENT_ACTION_VIDEO_CAMERA' app/src/main/java || exit 1
          ! grep -R 'PickVisualMedia' app/src/main/java || exit 1
          ! grep -R 'WatermarkExporter' app/src/main/java || exit 1
          ! grep -R 'media3-transformer' app/build.gradle.kts || exit 1

      - name: Lint and unit checks
        run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest

      - name: Seven clean build passes
        run: |
          set -eux
          for i in 1 2 3 4 5 6 7; do
            echo "===== FINAL BUILD PASS $i / 7 ====="
            gradle --no-daemon :app:clean :app:assembleDebug
            test -s app/build/outputs/apk/debug/app-debug.apk
            unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          done

      - name: Verify final APK contents
        run: |
          unzip -p app/build/outputs/apk/debug/app-debug.apk res/drawable-nodpi-v4/media_wahid_logo_original.jpg > /tmp/media.jpg
          unzip -p app/build/outputs/apk/debug/app-debug.apk res/drawable-nodpi-v4/masjid_raya_logo.jpg > /tmp/masjid.jpg
          test -s /tmp/media.jpg
          test -s /tmp/masjid.jpg
          echo "667ad7deacf950ac42f3cb8bb3b3b80228399b70f15ae7b9f7f5177bfc3adbb5  /tmp/masjid.jpg" | sha256sum -c -

      - name: Rename final APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MEDIA-WAHID-TV-Camera-v5.0.0-FINAL.apk

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: MEDIA-WAHID-TV-Camera-v5.0.0-FINAL
          path: MEDIA-WAHID-TV-Camera-v5.0.0-FINAL.apk
          if-no-files-found: error
          retention-days: 30
