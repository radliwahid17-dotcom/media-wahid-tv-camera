name: Build MEDIA WAHID TV Camera FINAL

on:
  push:
    branches:
      - main
      - final-v5-locked
  workflow_dispatch:

jobs:
  final-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct final Masjid logo
        run: |
          cat app/src/main/logo-source/masjid_final.part*.b64 | tr -d '\n\r ' | base64 -d > app/src/main/res/drawable-nodpi/masjid_raya_logo.jpg
          test "$(stat -c%s app/src/main/res/drawable-nodpi/masjid_raya_logo.jpg)" = "8690"
          echo "667ad7deacf950ac42f3cb8bb3b3b80228399b70f15ae7b9f7f5177bfc3adbb5  app/src/main/res/drawable-nodpi/masjid_raya_logo.jpg" | sha256sum -c -

      - name: Verify watermark assets
        run: |
          test "$(stat -c%s app/src/main/res/drawable-nodpi/media_wahid_logo_original.jpg)" = "12293"
          echo "0e39bb68c188af300ffdceed84e4d7cec262612108020131de1601003e5e98e4  app/src/main/res/drawable-nodpi/media_wahid_logo_original.jpg" | sha256sum -c -

          cat > /tmp/VerifyImage.java <<'EOF'
          import javax.imageio.ImageIO;
          import java.awt.image.BufferedImage;
          import java.io.File;

          public class VerifyImage {
              public static void main(String[] args) throws Exception {
                  BufferedImage image = ImageIO.read(new File(args[0]));
                  if (image == null || image.getWidth() != 303 || image.getHeight() != 174) {
                      throw new IllegalStateException("Logo invalid: " + args[0]);
                  }
                  System.out.println(args[0] + " -> 303x174 OK");
              }
          }
          EOF

          java /tmp/VerifyImage.java app/src/main/res/drawable-nodpi/media_wahid_logo_original.jpg
          java /tmp/VerifyImage.java app/src/main/res/drawable-nodpi/masjid_raya_logo.jpg

      - name: Final architecture gate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path("app/src/main/java/tv/mediawahid/camera/MainActivity.kt").read_text()
          renderer = Path("app/src/main/java/tv/mediawahid/camera/LiveWatermarkRenderer.kt").read_text()
          gradle = Path("app/build.gradle.kts").read_text()
          manifest = Path("app/src/main/AndroidManifest.xml").read_text()

          assert 'versionName = "5.0.0"' in gradle
          assert 'val cameraX = "1.6.2"' in gradle
          assert 'warningsAsErrors = true' in gradle
          assert 'disable += "GradleDependency"' in gradle
          assert "media3-transformer" not in gradle
          assert "camera-effects" in gradle
          assert "android.permission.CAMERA" in manifest
          assert "android.permission.RECORD_AUDIO" in manifest
          assert "FileProvider" not in manifest

          assert "OverlayEffect(" in main
          assert "CameraEffect.PREVIEW" in main
          assert "CameraEffect.VIDEO_CAPTURE" in main
          assert "CameraEffect.IMAGE_CAPTURE" in main
          assert ".addEffect(overlayEffect)" in main
          assert ".asPersistentRecording()" in main
          assert "MediaStoreOutputOptions" in main
          assert "FLAG_KEEP_SCREEN_ON" in main
          assert "SCREEN_ORIENTATION_LOCKED" in main
          assert "watermarkRenderer.draw(frame)" in main
          assert "deleteFinalizedOutput" in main

          forbidden = [
              "INTENT_ACTION_VIDEO_CAMERA",
              "ACTION_VIDEO_CAPTURE",
              "PickVisualMedia",
              "EXTRA_DURATION_LIMIT",
              "setDurationLimitMillis",
              "setFileSizeLimit",
              "WatermarkExporter",
          ]
          for token in forbidden:
              assert token not in main, token

          assert "return false" in renderer
          assert "PorterDuff.Mode.CLEAR" in renderer
          assert "masjid_raya_logo" in renderer
          assert "media_wahid_logo_original" in renderer

          obsolete = [
              "app/src/main/java/tv/mediawahid/camera/WatermarkExporter.kt",
              "app/src/main/java/tv/mediawahid/camera/PhotoWatermarker.kt",
              "app/src/main/java/tv/mediawahid/camera/WatermarkVerifier.kt",
              "app/src/main/java/tv/mediawahid/camera/WatermarkGeometry.kt",
              "app/src/main/res/xml/file_paths.xml",
          ]
          for path in obsolete:
              assert not Path(path).exists(), path

          print("FINAL architecture gate: OK")
          PY

      - name: Clean build and lint
        run: gradle --no-daemon clean :app:assembleDebug :app:lintDebug

      - name: Print Android lint audit
        run: |
          REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$REPORT" ]; then
            echo "========== ANDROID LINT AUDIT =========="
            cat "$REPORT"
          else
            echo "Lint text report not found"
            exit 1
          fi

      - name: Ten-round build and APK integrity stress gate
        run: |
          for i in $(seq 1 10); do
            echo "========== FINAL STRESS ROUND $i / 10 =========="
            gradle :app:assembleDebug --rerun-tasks
            unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
            unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "media_wahid_logo_original"
            unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "masjid_raya_logo"
          done

      - name: Rename final APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MEDIA-WAHID-TV-Camera-v5.0.0-FINAL.apk

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: MEDIA-WAHID-TV-APK-v5-FINAL
          path: MEDIA-WAHID-TV-Camera-v5.0.0-FINAL.apk
          if-no-files-found: error
          retention-days: 30
