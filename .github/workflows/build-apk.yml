name: Build MEDIA WAHID TV Camera Final

on:
  push:
    branches: [ main, final-v5-live-watermark, diagnostic-a16-5g-preview ]
  workflow_dispatch:

jobs:
  final-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct final Masjid logo
        run: |
          cat app/src/main/logo-source/masjid_final.part*.b64 | tr -d '\n\r ' | base64 -d > app/src/main/res/drawable-nodpi/masjid_raya_logo.jpg
          test "$(stat -c%s app/src/main/res/drawable-nodpi/masjid_raya_logo.jpg)" = "8690"
          echo "667ad7deacf950ac42f3cb8bb3b3b80228399b70f15ae7b9f7f5177bfc3adbb5  app/src/main/res/drawable-nodpi/masjid_raya_logo.jpg" | sha256sum -c -
          test "$(stat -c%s app/src/main/res/drawable-nodpi/media_wahid_logo_original.jpg)" = "12293"

      - name: Final architecture regression gate
        run: |
          set -euo pipefail
          MAIN=app/src/main/java/tv/mediawahid/camera/MainActivity.kt
          RENDERER=app/src/main/java/tv/mediawahid/camera/LiveWatermarkRenderer.kt
          GRADLE=app/build.gradle.kts

          grep -q 'versionName = "A16-DIAG-1"' "$GRADLE"
          grep -q 'applicationId = "tv.mediawahid.camera.a16test"' "$GRADLE"
          grep -q 'TEST RAW A16' "$MAIN"
          grep -q 'if (diagnosticPreview)' "$MAIN"
          grep -q 'cameraX = "1.6.2"' "$GRADLE"
          grep -q 'Quality.FHD' "$MAIN"
          grep -q 'asPersistentRecording()' "$MAIN"
          grep -q 'ExperimentalPersistentRecording' "$MAIN"
          grep -q 'waitForPreviewReady' "$MAIN"
          grep -q 'MediaStoreOutputOptions.Builder' "$MAIN"
          grep -q 'PREVIEW or VIDEO_CAPTURE or IMAGE_CAPTURE' "$MAIN"
          grep -q 'watermarkRenderer?.template = recordingTemplate' "$MAIN"
          grep -q 'Stop rekaman dulu sebelum keluar' "$MAIN"
          grep -q 'TARGET_VIDEO_BITRATE = 8_000_000' "$MAIN"
          grep -q 'MIN_START_FREE_BYTES = 8L' "$MAIN"
          grep -q 'STOP_FREE_BYTES = 1L' "$MAIN"
          grep -q 'params.screenBrightness = 1.0f' "$MAIN"
          grep -q '@OptIn(ExperimentalPersistentRecording::class)' "$MAIN"
          grep -q 'overlayFailed = true' "$MAIN"
          grep -q 'sensorToBufferTransform' "$RENDERER"
          grep -q 'masjidLogo' "$RENDERER"
          grep -q 'mediaLogo' "$RENDERER"

          ! grep -R -q 'EXTRA_DURATION_LIMIT' app/src/main/java
          ! grep -R -q 'ACTION_VIDEO_CAPTURE' app/src/main/java
          ! grep -R -q 'INTENT_ACTION_VIDEO_CAMERA' app/src/main/java
          ! grep -R -q 'PickVisualMedia' app/src/main/java
          ! grep -R -q 'Transformer' app/src/main/java
          ! grep -R -q 'WatermarkExporter' app/src/main/java
          ! grep -R -q 'Media3' app/src/main/java
          ! grep -R -q 'setFileSizeLimit' app/src/main/java
          ! grep -R -q 'setDurationLimitMillis' app/src/main/java

          echo "Final architecture gate: PASS"

      - name: Final clean build, lint and tests
        run: |
          set -euo pipefail
          for i in 1; do
            echo "===== FINAL REGRESSION PASS ====="
            gradle --no-daemon clean :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
            test -s app/build/outputs/apk/debug/app-debug.apk
          done

      - name: Verify APK contents
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'media_wahid_logo_original'
          unzip -l "$APK" | grep -q 'masjid_raya_logo'
          cp "$APK" MEDIA-WAHID-TV-A16-DIAGNOSTIC-1.apk
          sha256sum MEDIA-WAHID-TV-A16-DIAGNOSTIC-1.apk > MEDIA-WAHID-TV-A16-DIAGNOSTIC-1.sha256

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: MEDIA-WAHID-TV-A16-DIAGNOSTIC-1
          path: |
            MEDIA-WAHID-TV-A16-DIAGNOSTIC-1.apk
            MEDIA-WAHID-TV-A16-DIAGNOSTIC-1.sha256
          if-no-files-found: error
          retention-days: 30
