name: Build MEDIA WAHID TV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reject obsolete logo source folders
        run: |
          test ! -d app/src/main/masjid-logo-source
          test ! -d app/src/main/masjid-logo-v2
          test ! -d app/src/main/masjid-logo-v3
          test ! -d app/src/main/masjid-logo-v4
          test ! -d app/src/main/masjid-logo-v5

      - name: Verify both watermark assets can decode
        run: |
          test "$(stat -c%s app/src/main/res/drawable-nodpi/media_wahid_logo_original.jpg)" = "12293"
          echo "0e39bb68c188af300ffdceed84e4d7cec262612108020131de1601003e5e98e4  app/src/main/res/drawable-nodpi/media_wahid_logo_original.jpg" | sha256sum -c -
          test "$(stat -c%s app/src/main/res/drawable-nodpi/masjid_raya_logo.jpg)" = "3520"

          cat > /tmp/VerifyImage.java <<'EOF'
          import javax.imageio.ImageIO;
          import java.io.File;
          public class VerifyImage {
              public static void main(String[] args) throws Exception {
                  var image = ImageIO.read(new File(args[0]));
                  if (image == null || image.getWidth() < 50 || image.getHeight() < 50) {
                      throw new IllegalStateException("Logo gagal di-decode: " + args[0]);
                  }
                  System.out.println(args[0] + " -> " + image.getWidth() + "x" + image.getHeight());
              }
          }
          EOF

          java /tmp/VerifyImage.java app/src/main/res/drawable-nodpi/media_wahid_logo_original.jpg
          java /tmp/VerifyImage.java app/src/main/res/drawable-nodpi/masjid_raya_logo.jpg

          ffmpeg -v error -xerror -i app/src/main/res/drawable-nodpi/media_wahid_logo_original.jpg -frames:v 1 -f null -
          ffmpeg -v error -xerror -i app/src/main/res/drawable-nodpi/masjid_raya_logo.jpg -frames:v 1 -f null -

      - name: Build and lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug

      - name: Verify both logos inside APK can decode
        run: |
          unzip -p app/build/outputs/apk/debug/app-debug.apk res/drawable-nodpi-v4/media_wahid_logo_original.jpg > /tmp/media_wahid_logo_original.jpg
          unzip -p app/build/outputs/apk/debug/app-debug.apk res/drawable-nodpi-v4/masjid_raya_logo.jpg > /tmp/masjid_raya_logo.jpg

          test -s /tmp/media_wahid_logo_original.jpg
          test -s /tmp/masjid_raya_logo.jpg

          java /tmp/VerifyImage.java /tmp/media_wahid_logo_original.jpg
          java /tmp/VerifyImage.java /tmp/masjid_raya_logo.jpg

          ffmpeg -v error -xerror -i /tmp/media_wahid_logo_original.jpg -frames:v 1 -f null -
          ffmpeg -v error -xerror -i /tmp/masjid_raya_logo.jpg -frames:v 1 -f null -

      - name: Verify dual-template code is packaged
        run: |
          grep -R "enum class WatermarkTemplate" app/src/main/java/tv/mediawahid/camera/WatermarkTemplate.kt
          grep -R "WatermarkTemplate.DUAL" app/src/main/java/tv/mediawahid/camera
          grep -R "WatermarkTemplate.MEDIA_ONLY" app/src/main/java/tv/mediawahid/camera

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MEDIA-WAHID-TV-Camera-v4.0.2-DUAL-TEMPLATE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MEDIA-WAHID-TV-APK-v4-DUAL-TEMPLATE
          path: MEDIA-WAHID-TV-Camera-v4.0.2-DUAL-TEMPLATE.apk
          retention-days: 30
