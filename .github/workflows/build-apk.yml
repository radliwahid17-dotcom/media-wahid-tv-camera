name: Build MEDIA WAHID TV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct original logo
        run: |
          cat app/src/main/logo-source/logo.part*.b64 | tr -d '\n\r ' | base64 -d > app/src/main/res/drawable-nodpi/media_wahid_logo_original.jpg

      - name: Verify original logo asset
        run: |
          test "$(stat -c%s app/src/main/res/drawable-nodpi/media_wahid_logo_original.jpg)" = "12293"
          echo "0e39bb68c188af300ffdceed84e4d7cec262612108020131de1601003e5e98e4  app/src/main/res/drawable-nodpi/media_wahid_logo_original.jpg" | sha256sum -c -

      - name: Reconstruct Masjid logo
        run: |
          cat app/src/main/masjid-logo-v4/logo.part*.b64 | tr -d '\n\r ' | base64 -d > app/src/main/res/drawable-nodpi/masjid_raya_logo.jpg

      - name: Verify Masjid logo asset
        run: |
          test "$(stat -c%s app/src/main/res/drawable-nodpi/masjid_raya_logo.jpg)" = "13310"
          echo "d87d514b239e6db7267d032777aeaa054549d9d5c39752fc4d9b5c65e8c14d8f  app/src/main/res/drawable-nodpi/masjid_raya_logo.jpg" | sha256sum -c -

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MEDIA-WAHID-TV-Camera.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MEDIA-WAHID-TV-APK
          path: MEDIA-WAHID-TV-Camera.apk
          retention-days: 30
